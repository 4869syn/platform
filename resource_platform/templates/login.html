{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 资源聚合仓库</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235B9BD5'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #f7fbff, #eaf4ff);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 48px 40px;
            position: relative;
        }

        .login-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            padding: 1px;
            background: var(--cyber-border-soft);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .login-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #58a6ff, #ff6b9a);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.35), 0 0 16px rgba(88, 166, 255, 0.4);
        }

        .login-logo span {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }

        .login-title {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--gray-500);
            margin-bottom: 32px;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 6px;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(125, 140, 180, 0.4);
            border-radius: var(--radius-md);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.85);
            outline: none;
            transition: var(--transition);
        }

        .login-form input[type="text"]:focus,
        .login-form input[type="password"]:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.18);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .login-error {
            background: #FFEBEE;
            color: #C62828;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(198, 40, 40, 0.2);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--gray-500);
        }

        .login-footer a {
            color: var(--primary-blue-dark);
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <span>SYN</span>
            </div>
            <h1 class="login-title">资源聚合仓库</h1>
            <p class="login-subtitle">请登录以访问平台资源</p>

            {% if form.errors %}
                <div class="login-error">
                    用户名或密码错误，请重新输入。
                </div>
            {% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">用户名</label>
                    <input type="text" id="id_username" name="username" placeholder="请输入用户名" required autofocus>
                </div>
                <div class="form-group">
                    <label for="id_password">密码</label>
                    <input type="password" id="id_password" name="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>
        </div>
    </div>
</body>
</html>
